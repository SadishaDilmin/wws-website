# Publishes a static client preview to https://sadishadilmin.github.io/wws-website/ on every push to main.
# GitHub Pages only serves static files, so the contact form's email API is left out of this build;
# the form offers WhatsApp and phone instead. The full site (with email) is meant for Vercel.
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Server-only email route cannot run on static hosting.
      - name: Remove server API route for static export
        run: rm -rf app/api
      - name: Build static site
        run: npm run build
        env:
          GITHUB_PAGES: "true"
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
